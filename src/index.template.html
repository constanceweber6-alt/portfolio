<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-k="meta_title"></title>
<meta name="description" content="{{meta_desc}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{meta_title}}">
<meta property="og:description" content="{{meta_desc}}">
<meta property="og:image" content="{{SITE_URL}}assets/img/og.png">
<meta property="og:url" content="{{SITE_URL}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23E8432E'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='15' fill='%23fff' text-anchor='middle'%3ECW%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Noto+Sans+JP:wght@400;500;700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="top">
  <div class="wrap top-in">
    <a class="seal" href="#top" aria-label="Constance Weber"><span>CW</span></a>
    <nav class="menu" aria-label="Sections">
      <a href="#work" data-k="nav_work"></a>
      <a href="#experience" data-k="nav_exp"></a>
      <a href="#education" data-k="nav_edu"></a>
      <a href="#contact" data-k="nav_contact"></a>
    </nav>
    <div class="langs" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="fr">FR</button>
      <button type="button" data-lang="ja">日本語</button>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="wrap">
      <div class="hero-meta">
        <span data-k="hero_role"></span>
        <span>FR / EN / JA</span>
      </div>
      <h1 class="giant" aria-label="Constance Weber">
        <span class="row"><span class="w">Constance</span></span>
        <span class="row"><span class="w">Weber</span></span>
      </h1>
      <div class="hero-grid">
        <div>
          <p class="claim" data-k="hero_h1"></p>
          <p class="lead" data-k="hero_lead"></p>
          <div class="ctas">
            <a class="btn btn-ink" href="#contact" data-k="hero_cta_contact"></a>
            <a class="btn btn-line" href="#work" data-k="hero_cta_work"></a>
            <a class="btn btn-line" data-cv href="cv/Constance_Weber_CV_EN.pdf" download data-k="cv"></a>
          </div>
        </div>
        <aside class="postit" aria-hidden="true">
          <span data-k="contact_lead"></span>
        </aside>
      </div>
    </div>
  </section>

  <section class="path" aria-labelledby="pathTitle">
    <div class="wrap">
      <h2 class="label-title" id="pathTitle" data-k="line_title"></h2>
    </div>
    <div class="metro-scroll">
      <ol class="metro">
        <li><time>2016</time><b data-k="st_munich"></b><span data-k="st_munich_sub"></span></li>
        <li class="jp"><time>2018</time><b data-k="st_sagae"></b><span data-k="st_sagae_sub"></span></li>
        <li><time>2020</time><b data-k="st_essec"></b><span data-k="st_essec_sub"></span></li>
        <li class="jp"><time>2023</time><b data-k="st_osaka"></b><span data-k="st_osaka_sub"></span></li>
        <li><time>2023</time><b data-k="st_bnp"></b><span data-k="st_bnp_sub"></span></li>
        <li><time>2024</time><b data-k="st_as"></b><span data-k="st_as_sub"></span></li>
        <li><time>2025</time><b data-k="st_smib"></b><span data-k="st_smib_sub"></span></li>
        <li class="now"><time data-k="line_now"></time><b data-k="st_ibm"></b><span data-k="st_ibm_sub"></span></li>
      </ol>
    </div>
  </section>

  <section class="work" id="work">
    <div class="wrap">
      <h2 class="big-title" data-k="work_title"></h2>
      <p class="section-lead" data-k="work_lead"></p>

      <article class="project p-rse">
        <a class="shot" href="https://constanceweber6-alt.github.io/rse-prediagnostic/" target="_blank" rel="noopener">
          <img src="assets/img/rse.webp" width="1600" height="1000" alt="" loading="lazy">
        </a>
        <div class="project-text">
          <p class="for" data-k="p1_for"></p>
          <h3 data-k="p1_name"></h3>
          <p data-k="p1_desc"></p>
          <p class="shows" data-k="p1_shows"></p>
          <div class="ctas">
            <a class="btn btn-ink" href="https://constanceweber6-alt.github.io/rse-prediagnostic/" target="_blank" rel="noopener" data-k="p1_try"></a>
            <a class="btn btn-line" href="https://github.com/constanceweber6-alt/rse-prediagnostic" target="_blank" rel="noopener" data-k="code"></a>
          </div>
        </div>
      </article>

      <article class="project p-cb flip">
        <a class="shot" href="https://constanceweber6-alt.github.io/change-barometer/dashboard.html#demo" target="_blank" rel="noopener">
          <img src="assets/img/cb.webp" width="1600" height="1000" alt="" loading="lazy">
        </a>
        <div class="project-text">
          <p class="for" data-k="p2_for"></p>
          <h3 data-k="p2_name"></h3>
          <p data-k="p2_desc"></p>
          <p class="shows" data-k="p2_shows"></p>
          <div class="ctas">
            <a class="btn btn-ink" href="https://constanceweber6-alt.github.io/change-barometer/dashboard.html#demo" target="_blank" rel="noopener" data-k="p2_try"></a>
            <a class="btn btn-line" href="https://github.com/constanceweber6-alt/change-barometer" target="_blank" rel="noopener" data-k="code"></a>
          </div>
        </div>
      </article>
    </div>
  </section>

  <section class="exp" id="experience">
    <div class="wrap">
      <h2 class="big-title" data-k="exp_title"></h2>
      <div class="jobs">
        <details class="job" open>
          <summary><span class="org" data-k="e1_org"></span><span class="role" data-k="e1_role"></span><span class="dates" data-k="e1_dates"></span></summary>
          <dl class="case">
            <div><dt data-k="ctx"></dt><dd data-k="e1_ctx"></dd></div>
            <div><dt data-k="did"></dt><dd data-k="e1_did"></dd></div>
            <div><dt data-k="res"></dt><dd class="result" data-k="e1_res"></dd></div>
          </dl>
        </details>
        <details class="job">
          <summary><span class="org" data-k="e2_org"></span><span class="role" data-k="e2_role"></span><span class="dates" data-k="e2_dates"></span></summary>
          <dl class="case">
            <div><dt data-k="did"></dt><dd data-k="e2_did"></dd></div>
          </dl>
        </details>
        <details class="job">
          <summary><span class="org" data-k="e3_org"></span><span class="role" data-k="e3_role"></span><span class="dates" data-k="e3_dates"></span></summary>
          <dl class="case">
            <div><dt data-k="ctx"></dt><dd data-k="e3_ctx"></dd></div>
            <div><dt data-k="did"></dt><dd data-k="e3_did"></dd></div>
            <div><dt data-k="res"></dt><dd class="result" data-k="e3_res"></dd></div>
          </dl>
        </details>
        <details class="job">
          <summary><span class="org" data-k="e4_org"></span><span class="role" data-k="e4_role"></span><span class="dates" data-k="e4_dates"></span></summary>
          <dl class="case">
            <div><dt data-k="did"></dt><dd data-k="e4_did"></dd></div>
          </dl>
        </details>
      </div>
      <div class="earlier">
        <h3 data-k="earlier_title"></h3>
        <ul>
          <li data-k="earlier_1"></li>
          <li data-k="earlier_2"></li>
          <li data-k="earlier_3"></li>
          <li data-k="earlier_4"></li>
        </ul>
      </div>
    </div>
  </section>

  <section class="edu" id="education">
    <div class="wrap edu-grid">
      <div>
        <h2 class="big-title" data-k="edu_title"></h2>
        <ul class="schools">
          <li><b data-k="edu1"></b><span data-k="edu1_sub"></span></li>
          <li><b data-k="edu2"></b><span data-k="edu2_sub"></span></li>
          <li class="jp"><b data-k="edu3"></b><span data-k="edu3_sub"></span></li>
          <li class="jp"><b data-k="edu4"></b><span data-k="edu4_sub"></span></li>
        </ul>
      </div>
      <div class="side">
        <p class="vertical" lang="ja" aria-hidden="true">寒河江から大阪へ</p>
        <h3 data-k="lang_title"></h3>
        <ul class="plain">
          <li data-k="lang_fr"></li>
          <li data-k="lang_en"></li>
          <li data-k="lang_ja"></li>
        </ul>
        <h3 data-k="cert_title"></h3>
        <p data-k="cert_list"></p>
        <h3 data-k="vol_title"></h3>
        <p data-k="vol_text"></p>
      </div>
    </div>
  </section>

  <section class="contact" id="contact">
    <div class="wrap">
      <h2 class="giant giant-contact" data-k="contact_title"></h2>
      <p class="contact-lead" data-k="contact_lead"></p>
      <div class="ctas">
        <a class="btn btn-paper" href="mailto:{{EMAIL}}" data-k="contact_mail"></a>
        <a class="btn btn-ghost" href="https://www.linkedin.com/in/constance-weber/" target="_blank" rel="noopener" data-k="contact_li"></a>
        <a class="btn btn-ghost" data-cv href="cv/Constance_Weber_CV_EN.pdf" download data-k="cv"></a>
      </div>
      <p class="mail-text"><a href="mailto:{{EMAIL}}">{{EMAIL}}</a></p>
    </div>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p data-k="footer"></p>
    <p data-k="footer_tm"></p>
  </div>
</footer>

<script src="assets/i18n.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
